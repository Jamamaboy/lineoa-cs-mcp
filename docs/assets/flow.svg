<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#3d4450"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#06c755"/></marker>
    <!-- a person, drawn like LINE's docs: white body, black outline -->
    <g id="p"><circle cx="0" cy="-16" r="13" stroke="#111" stroke-width="3.2"/><path d="M-21 26 V12 Q-21 -2 0 -2 Q21 -2 21 12 V26 Z" stroke="#111" stroke-width="3.2" stroke-linejoin="round"/></g>
  </defs>
  <style>
    .t{font-size:30px;font-weight:800;fill:#1f2328}.h{font-size:20px;font-weight:800;fill:#fff}
    .b{font-size:15px;font-weight:700;fill:#1f2328}.s{font-size:13px;fill:#3d4450}.w{font-size:13px;font-weight:700;fill:#fff}
    .step{font-size:14px;font-weight:800;fill:#fff}.ln{stroke:#3d4450;stroke-width:2.2;fill:none}.lg{stroke:#06c755;stroke-width:3;fill:none}
  </style>
  <rect width="1400" height="640" fill="#ffffff"/>
  <text class="t" x="40" y="54">How a support chat flows through lineoa-cs</text>

  <!-- customers -->
  <rect x="40" y="96" width="360" height="330" rx="22" fill="#7cb8f7"/>
  <text class="h" x="64" y="132">Customers</text>
  <g fill="#fff">
    <use href="#p" x="90" y="200"/><use href="#p" x="160" y="200" fill="#6df24a"/><use href="#p" x="230" y="200"/><use href="#p" x="300" y="200"/><use href="#p" x="365" y="200"/>
    <use href="#p" x="125" y="290"/><use href="#p" x="195" y="290"/><use href="#p" x="265" y="290" fill="#6df24a"/><use href="#p" x="335" y="290"/>
  </g>
  <g transform="translate(64,346)"><rect width="150" height="34" rx="17" fill="#fff"/><path d="M24 34 l-6 12 l18 -12z" fill="#fff"/><text class="s" x="75" y="22" text-anchor="middle">ของมาไม่ครบค่ะ</text></g>
  <g transform="translate(226,346)"><rect width="150" height="34" rx="17" fill="#fff"/><path d="M24 34 l-6 12 l18 -12z" fill="#fff"/><text class="s" x="75" y="22" text-anchor="middle">ขอใบเสร็จได้ไหม</text></g>
  <text class="w" x="64" y="410">● green = waiting for a reply</text>

  <!-- LINE OA -->
  <g transform="translate(470,170)">
    <path d="M0 0 H96 V64 Q96 104 48 124 Q0 104 0 64 Z" fill="#06c755"/>
    <text x="48" y="78" font-size="62" font-weight="800" fill="#fff" text-anchor="middle">L</text>
  </g>
  <text class="b" x="518" y="326" text-anchor="middle">LINE Official</text>
  <text class="b" x="518" y="346" text-anchor="middle">Account</text>
  <text class="s" x="518" y="366" text-anchor="middle">chat.line.biz</text>
  <path class="ln" d="M400 230 H462" marker-end="url(#a)"/>
  <circle cx="430" cy="210" r="14" fill="#3d4450"/><text class="step" x="430" y="215" text-anchor="middle">1</text>
  <text class="s" x="404" y="258">messages</text>

  <!-- your computer -->
  <rect x="640" y="96" width="720" height="460" rx="22" fill="#f3f0ff" stroke="#c9bdf7" stroke-width="2"/>
  <text x="664" y="132" font-size="20" font-weight="800" fill="#5b3fd1">The CS person's computer</text>

  <!-- staff with laptop -->
  <g fill="#fff"><use href="#p" x="730" y="250"/></g>
  <rect x="696" y="282" width="68" height="44" rx="4" fill="#3d4450"/><rect x="684" y="326" width="92" height="8" rx="3" fill="#3d4450"/>
  <text class="b" x="730" y="360" text-anchor="middle">CS person</text>

  <!-- AI app -->
  <rect x="880" y="160" width="230" height="96" rx="16" fill="#6f4ef2"/>
  <text x="995" y="198" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">AI app ✦</text>
  <text class="w" x="995" y="222" text-anchor="middle">Claude Code · Desktop</text>
  <text class="w" x="995" y="242" text-anchor="middle">any MCP client</text>
  <path class="ln" d="M770 230 C820 200 840 200 872 205" marker-end="url(#a)"/>
  <circle cx="826" cy="240" r="14" fill="#6f4ef2"/><text class="step" x="826" y="245" text-anchor="middle">3</text>
  <g transform="translate(776,146)"><rect width="196" height="30" rx="15" fill="#fff" stroke="#c9bdf7"/><text class="s" x="98" y="20" text-anchor="middle">"Which chats are waiting?"</text></g>

  <!-- lineoa-cs -->
  <rect x="880" y="360" width="230" height="110" rx="16" fill="#24292f"/>
  <g transform="translate(912,415)" fill="none" stroke="#6df24a" stroke-width="5"><circle r="14"/><path d="M0 -24 V-16 M0 16 V24 M-24 0 H-16 M16 0 H24 M-17 -17 L-11 -11 M11 11 L17 17 M-17 17 L-11 11 M11 -11 L17 -17"/></g>
  <text x="1010" y="398" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">lineoa-cs</text>
  <text class="w" x="1010" y="420" text-anchor="middle">list · read · search</text>
  <text class="w" x="1010" y="440" text-anchor="middle">profile · attachment</text>
  <text x="1010" y="458" font-size="11.5" fill="#9198a1" text-anchor="middle">send: off by default</text>
  <path class="ln" d="M995 256 V352" marker-end="url(#a)"/>
  <circle cx="1018" cy="300" r="14" fill="#24292f"/><text class="step" x="1018" y="305" text-anchor="middle">4</text>
  <text class="s" x="1038" y="305">tool calls</text>

  <!-- lineoa-cs <-> LINE -->
  <path class="lg" d="M872 452 C700 476 640 300 572 250" marker-end="url(#g)" marker-start="url(#g)"/>
  <text class="s" x="560" y="472">HTTPS + the staff</text>
  <text class="s" x="560" y="490">member's session</text>

  <!-- login -->
  <path class="ln" d="M730 370 V500 H872" marker-end="url(#a)" stroke-dasharray="6 5"/>
  <circle cx="730" cy="430" r="14" fill="#3d4450"/><text class="step" x="730" y="435" text-anchor="middle">2</text>
  <text class="s" x="748" y="490">npm run login (once)</text>
  <text class="s" x="748" y="530" fill="#57606a">the person types the password</text>

  <!-- results -->
  <path class="ln" d="M1110 208 H1150" marker-end="url(#a)"/>
  <circle cx="1130" cy="186" r="14" fill="#6f4ef2"/><text class="step" x="1130" y="191" text-anchor="middle">5</text>
  <g transform="translate(1158,150)">
    <rect width="186" height="58" rx="10" fill="#fff" stroke="#d0d7de"/><text class="b" x="14" y="24">2 chats waiting</text>
    <g fill="#6df24a" transform="translate(28,44) scale(.42)"><use href="#p" x="0" y="0"/><use href="#p" x="60" y="0"/></g>
    <rect y="68" width="186" height="46" rx="10" fill="#fff" stroke="#d0d7de"/><text class="b" x="14" y="90">Summary</text><text class="s" x="14" y="106">refund #1250 · receipt</text>
    <rect y="124" width="186" height="64" rx="10" fill="#fff" stroke="#6f4ef2" stroke-width="2"/><text class="b" x="14" y="146">Draft reply</text><text class="s" x="14" y="164">ขอโทษค่ะ เดี๋ยวดำเนินการ</text><text class="s" x="14" y="180">คืนเงินให้นะคะ</text>
  </g>
  <g transform="translate(1158,350)">
    <rect width="186" height="74" rx="10" fill="#e8f8ee" stroke="#06c755" stroke-width="2"/>
    <circle cx="26" cy="37" r="14" fill="#06c755"/><path d="M19 37 l5 5 l10 -11" stroke="#fff" stroke-width="3" fill="none"/>
    <text class="b" x="48" y="32">Human says OK</text><text class="s" x="48" y="52">→ send_message</text>
  </g>
  <circle cx="1136" cy="387" r="14" fill="#06c755"/><text class="step" x="1136" y="392" text-anchor="middle">6</text>

  <!-- reply back to customers -->
  <path class="lg" d="M1250 424 V590 H220 V434" marker-end="url(#g)"/>
  <text class="b" x="560" y="582" fill="#06a148">reply arrives as the staff member · audit-logged</text>
  <text class="s" x="40" y="626">Read-only by default. Sending needs LINEOA_ALLOW_SEND=true, passes a chat allowlist and a daily cap, and the AI app asks the human first.</text>
</svg>
